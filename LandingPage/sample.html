<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Angle Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            width: 360px;
            background-color: #333;
            /* height: 300px; */
            color: white;
            border-radius: 10px;
            /* overflow: hidden; */
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            position: relative;
        }
        .content {
            padding: 20px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
        }
        .subtitle {
            font-size: 14px;
            color: #ccc;
        }
        .image-container {
            /* position: relative; */
            width: 100%;
            height: 250px;
            background: url(Images/Chain.png) no-repeat center;
            /* background-size: 400px; */
            clip-path: polygon(0 25%, 100% 0, 100% 100%, 0 100%);
        }
        .two-lines {
            display: -webkit-box;       /* Set the display to a flexbox-like container */
            -webkit-line-clamp: 2;      /* Limit the text to 2 lines */
            -webkit-box-orient: vertical; /* Define the layout as vertical */
            overflow: hidden;           /* Hide anything that overflows */
            text-overflow: ellipsis;    /* Optionally add ellipsis to indicate clipping */
        }

    </style>
</head>
