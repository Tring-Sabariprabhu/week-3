<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rajdhani:wght@300;400;500;600;700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
        <div class="SignIn">

            <div class="form_container">
                <div class="main_container">
                    <div class="icon_container">
                        <img src="tringapps-copy-2.svg" alt="" >
                    </div>
                    <div class="container2">
                        <div class="container3">
                            <button class="button_style signInButton font_Rajdhani cursor_pointer">Sign In</button>
                            <button class="button_style signUpButton font_Rajdhani cursor_pointer">Sign Up</button>
                        </div>
                        <div class="container4">
                            <div class="input_fields">
                                <div class="input1 flex_column ">
                                    <label for="" class="font_Rajdhani">Your Name</label>
                                    <input type="text" class="font_OpenSans" name="" placeholder="Enter email">
                                </div>
                                <div class="input2 flex_column">
                                    <label for="" class="font_Rajdhani">Your Password</label>
                                    <div class="password flex_row">
                                        <input type="password" class="font_OpenSans" name="" id="" placeholder="Enter password">
                                        <img src="Visibility off.svg" class="cursor_pointer" alt="">
                                    </div>
                                    <div class="input3 flex_row">
                                        <div class="remember flex_row">
                                            <input type="checkbox" name="" id="">
                                            <p class="font_OpenSans"> Remember me</p>
                                        </div>
                                        <div class="forgot_password">
                                            <a href="" class="font_OpenSans">Forgot Password?</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="button_fields flex_column">
                                <button class="button_style submit_Button font_OpenSans cursor_pointer"> Submit</button>
                                <div class="message "><p>OR</p> <hr> </div>                        
                                <button class="button_style signInGoogle_Button font_OpenSans cursor_pointer"> <span><span class="message">Sign In with</span><img src="ic_google.svg" alt="" ></span></button>
                            </div>
                            <div class="HaveNotAccMessage flex_row">
                                <p>Don't Have an Account?<a href="">Sign Up</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- <form action="">

            </form> -->
            <div class="Image">
            </div>
        </div>
</body>
</html>
